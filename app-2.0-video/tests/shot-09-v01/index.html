<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shot 09 — Analyst screens</title>
  <style>
    @font-face{font-family:Geist;src:url('./assets/fonts/Geist-Regular.woff2') format('woff2');font-weight:400}
    @font-face{font-family:Geist;src:url('./assets/fonts/Geist-SemiBold.woff2') format('woff2');font-weight:600}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f7f7;font-family:Geist,Arial,sans-serif}body{display:grid;place-items:center}
    #viewport{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;overflow:hidden;background:#f7f7f7}
    #shot{position:absolute;inset:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:radial-gradient(circle at 50% 82%,#fff 0 28%,#f7f7f7 70%)}
    .floor{position:absolute;left:90px;right:90px;bottom:-110px;height:300px;border-radius:50%;background:rgba(0,0,0,.08);filter:blur(64px)}
    .phone{position:absolute;top:110px;width:480px;height:970px;overflow:hidden;border:1px solid #272727;border-radius:44px 44px 0 0;background:#050505;color:#f5f5f5;box-shadow:0 28px 80px rgba(0,0,0,.18);transform-origin:50% 100%}
    .phone:nth-of-type(1){left:130px}.phone:nth-of-type(2){left:720px}.phone:nth-of-type(3){left:1310px}
    .status{height:56px;padding:17px 25px 0;display:flex;align-items:flex-start;font-size:22px;font-weight:600}.signal{margin-left:auto;letter-spacing:2px}.battery{margin-left:9px;padding:1px 7px;border-radius:7px;background:#eee;color:#050505;font-size:18px}
    .asset-head{height:102px;padding:16px 22px 9px;display:flex;align-items:center;gap:14px}.back{font-size:48px;font-weight:300;color:#ddd}.logo{width:62px;height:62px;overflow:hidden;border:1px solid #292929;border-radius:50%;background:#fff;flex:none}.logo img{width:100%;height:100%;object-fit:cover}.ticker{font-size:35px;line-height:1;letter-spacing:-1.2px}.name{margin-top:8px;color:#a6a6a6;font-size:20px}.type{margin-left:7px;padding:4px 8px;border-radius:8px;background:#32123b;color:#d95cff;font-size:16px;vertical-align:4px}
    .tabs{height:60px;margin:0 15px;display:flex;align-items:center;justify-content:space-between;color:#9d9d9d;font-size:21px}.tab{padding:10px 9px;border-radius:12px}.tab.active{background:#292929;color:#fff}
    .estimates{height:230px;padding:18px 20px 0;border-top:1px solid #171717}.section-title{font-size:27px;font-weight:600}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:22px 34px;margin-top:24px}.metric label{display:block;color:#929292;font-size:18px}.metric b{display:block;margin-top:7px;font-size:27px;font-weight:400}.metric b em{margin-left:6px;color:#08bd78;font-size:17px;font-style:normal}.metric b em.down{color:#ff5e64}
    .chart-section{height:256px;padding:11px 20px 0}.chart-title{font-size:25px;font-weight:600}.chart{height:191px;margin-top:13px;display:flex;align-items:center;gap:12px;padding:0 7px 28px;border-bottom:1px solid #252525}.bar-wrap{height:100%;display:flex;flex:1;align-items:center;justify-content:center;position:relative}.bar{width:100%;max-width:35px;border-radius:7px;background:#08bd78;transform-origin:50% 50%}.bar.neg{background:#ff5e64}.bar-wrap span{position:absolute;bottom:-24px;color:#777;font-size:12px}
    .insiders{height:228px}.insiders .chart{height:165px}.brief{margin:8px 20px 0;padding:14px 16px;border:1px solid #242424;border-radius:16px;background:#111}.brief-top{display:flex;align-items:center;font-size:17px;font-weight:600}.brief-top span{margin-left:auto;color:#08bd78}.brief p{margin:7px 0 0;color:#929292;font-size:15px;line-height:1.35}
  </style>
</head>
<body>
  <div id="viewport" data-composition-id="minara-shot-09" data-width="1920" data-height="1080" data-start="0" data-duration="1.867" data-fps="60" data-root="true">
    <main id="shot"><div class="floor"></div></main>
  </div>
  <script src="./assets/vendor/gsap.min.js"></script>
  <script>
    const shot=document.querySelector('#shot');const fit=()=>{const v=document.querySelector('#viewport');shot.style.transform=`scale(${v.clientWidth/1920})`};addEventListener('resize',fit);fit();
    const assets=[
      {ticker:'$AAPL',name:'Apple',logo:'apple.png',holders:'6,220',holdersDelta:'+188',shares:'+12.8M',value:'$4.12T',valueDelta:'+106B',ownership:'62.8%',ownershipDelta:'+0.9pp',inst:[34,12,-22,46,-31,9,39,88],inside:[76,14,-3,5,68,17,12,15],brief:'Institutional ownership remains broad with consistent quarterly accumulation.'},
      {ticker:'$MSFT',name:'Microsoft',logo:'microsoft.png',holders:'5,840',holdersDelta:'+142',shares:'+9.6M',value:'$3.78T',valueDelta:'+84B',ownership:'71.4%',ownershipDelta:'+1.2pp',inst:[28,18,35,-16,52,22,44,76],inside:[61,11,-5,8,72,16,10,13],brief:'Large-cap funds continue adding exposure alongside resilient cloud estimates.'},
      {ticker:'$TSLA',name:'Tesla',logo:'tesla.png',holders:'4,116',holdersDelta:'+96',shares:'-6.4M',value:'$1.08T',valueDelta:'+42B',ownership:'47.9%',ownershipDelta:'+0.6pp',inst:[24,-9,-27,42,-18,13,33,82],inside:[83,18,-2,4,59,12,9,11],brief:'Ownership is stabilizing as funds rebalance around delivery expectations.'}
    ];
    const bars=(values)=>values.map((v,i)=>`<div class="bar-wrap"><i class="bar ${v<0?'neg':''}" style="height:${Math.max(6,Math.abs(v))}%;transform:translateY(${v<0?'42':'-8'}px)"></i><span>${24+Math.floor(i/4)}Q${i%4+1}</span></div>`).join('');
    const card=d=>`<article class="phone"><div class="status" data-grow><span>14:42 ◐</span><span class="signal">▮▮▮ ◇</span><span class="battery">100</span></div><header class="asset-head" data-grow><span class="back">‹</span><span class="logo"><img src="assets/logos/${d.logo}" alt="${d.name}"></span><div><div class="ticker">${d.ticker}<span class="type">Stock</span></div><div class="name">${d.name}</div></div></header><nav class="tabs" data-grow><span class="tab">Overview</span><span class="tab">Stats</span><span class="tab">Earnings</span><span class="tab active">Analyst</span><span class="tab">News</span></nav><section class="estimates" data-grow><div class="section-title">Financial Estimates</div><div class="metrics"><div class="metric"><label>Holders</label><b>${d.holders}<em>${d.holdersDelta}</em></b></div><div class="metric"><label>Shares</label><b>${d.shares}<em class="${d.shares.startsWith('-')?'down':''}">${d.shares.startsWith('-')?'reduced':'added'}</em></b></div><div class="metric"><label>Total Value</label><b>${d.value}<em>${d.valueDelta}</em></b></div><div class="metric"><label>Ownership</label><b>${d.ownership}<em>${d.ownershipDelta}</em></b></div></div></section><section class="chart-section" data-grow><div class="chart-title">Institutions</div><div class="chart">${bars(d.inst)}</div></section><section class="chart-section insiders" data-grow><div class="chart-title">Insiders</div><div class="chart">${bars(d.inside)}</div></section><section class="brief" data-grow><div class="brief-top">AI analyst brief <span>Constructive</span></div><p>${d.brief}</p></section></article>`;
    assets.forEach(d=>shot.insertAdjacentHTML('beforeend',card(d)));
    const phones=[...shot.querySelectorAll('.phone')];gsap.set(phones,{y:1080});phones.forEach(phone=>{gsap.set(phone.querySelectorAll('[data-grow]'),{opacity:0,y:18,scale:.97});gsap.set(phone.querySelectorAll('.bar'),{scaleY:0})});
    const tl=gsap.timeline({paused:true});phones.forEach((phone,i)=>{const start=i*.24;tl.to(phone,{y:0,duration:.98,ease:'power3.out'},start).to(phone.querySelectorAll('[data-grow]'),{opacity:1,y:0,scale:1,duration:.34,stagger:.035,ease:'power2.out'},start+.001).to(phone.querySelectorAll('.bar'),{scaleY:1,duration:.62,stagger:.035,ease:'power3.out'},start+.3)});tl.duration(1.867);window.__timelines=window.__timelines||{};window.__timelines['minara-shot-09']=tl;
  </script>
</body>
</html>
