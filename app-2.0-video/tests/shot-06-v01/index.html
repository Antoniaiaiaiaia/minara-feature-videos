    #hero-copy{position:absolute;z-index:1000;left:50%;top:50%;display:flex;gap:.18em;transform:translate(-50%,-50%);white-space:nowrap;font-size:264px;line-height:.9;font-weight:600;letter-spacing:-.07em}
    .hero-word{display:inline-block;opacity:0;will-change:transform,opacity,filter}
  </style>

  <script>
    (function(){
      var spin={value:0};
      var assets=Array.from(document.querySelectorAll('.asset'));
      var radius=350,perspective=920;
      assets.forEach(function(el){var s=Number(el.dataset.size);el.style.width=s+'px';el.style.height=s+'px';el.style.margin=(-s/2)+'px 0 0 '+(-s/2)+'px'});
      function updateSphere(){
        assets.forEach(function(el){
          var lat=Number(el.dataset.lat),latitudeSpeed=.62+(1-Math.min(Math.abs(lat)/1.08,1))*1.08;
          var angle=Number(el.dataset.phase)+spin.value*latitudeSpeed;
          var x3=Math.cos(lat)*Math.sin(angle)*radius;
          var y3=Math.sin(lat)*radius;
          var z3=Math.cos(lat)*Math.cos(angle)*radius;
          var projection=perspective/(perspective-z3*.72);
          var depth=(z3+radius)/(radius*2);
          gsap.set(el,{x:x3*projection,y:y3*projection,scale:(.56+depth*.64)*projection,opacity:.34+depth*.66,filter:'blur('+((1-depth)*1.7)+'px)',rotation:(depth-.5)*7});
          el.style.zIndex=String(10+Math.round(depth*100));
        });
      }
      updateSphere();
      var tl=gsap.timeline({paused:true});
      tl.fromTo('#sphere-world',{scale:1.64,opacity:0,filter:'blur(14px)'},{scale:2,opacity:1,filter:'blur(0px)',duration:.48,ease:'power3.out'},0)
        .fromTo('.asset img',{scale:.35,opacity:0,filter:'blur(12px)'},{scale:1,opacity:1,filter:'blur(0px)',duration:.42,stagger:.025,ease:'back.out(1.7)'},.08)
        .to(spin,{value:Math.PI*2,duration:4.133,ease:'none',onUpdate:updateSphere},0)
        .to('#sphere-world',{scale:5.55,rotation:2,filter:'blur(.35px)',duration:1.08,ease:'power3.inOut'},2.333)
        .to('#rings',{opacity:.22,duration:.55,ease:'power2.out'},2.55)
        .fromTo('.hero-word',{y:34,scale:.9,opacity:0,filter:'blur(20px)'},{y:0,scale:1,opacity:1,filter:'blur(0px)',duration:.54,stagger:.14,ease:'power3.out'},2.68);
      window.__timelines=window.__timelines||{};window.__timelines['minara-shot-06']=tl;
    })();
  </script>
