<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shot 07 — Three market screens</title>
  <style>
    @font-face{font-family:Geist;src:url('./assets/fonts/Geist-Regular.woff2') format('woff2');font-weight:400}
    @font-face{font-family:Geist;src:url('./assets/fonts/Geist-SemiBold.woff2') format('woff2');font-weight:600}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f7f5;font-family:Geist,Arial,sans-serif}body{display:grid;place-items:center}
    #viewport{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;overflow:hidden;background:#f7f7f5}
    #shot{position:absolute;inset:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:radial-gradient(circle at 50% 78%,#fff 0 28%,#f7f7f5 68%)}
    .floor{position:absolute;left:80px;right:80px;bottom:-100px;height:300px;border-radius:50%;background:rgba(0,0,0,.07);filter:blur(60px)}
    .phone{position:absolute;top:110px;width:480px;height:970px;border-radius:44px 44px 0 0;background:#050505;color:#f5f5f5;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.18);border:1px solid #262626;transform-origin:50% 100%}
    .phone:nth-of-type(1){left:130px}.phone:nth-of-type(2){left:720px}.phone:nth-of-type(3){left:1310px}
    .status{height:58px;padding:18px 25px 0;display:flex;align-items:flex-start;font-size:24px;font-weight:600}.signal{margin-left:auto;letter-spacing:2px}.battery{margin-left:9px;padding:1px 6px;border-radius:6px;background:#eee;color:#050505;font-size:19.5px}
    .asset-head{height:104px;padding:18px 22px 8px;display:flex;align-items:center;gap:13px}.back{font-size:51px;font-weight:300;color:#ddd}.logo{width:58px;height:58px;flex:0 0 58px;border-radius:50%;overflow:hidden;background:#f5f5f5}.logo img{display:block;width:100%;height:100%;object-fit:cover}.asset-copy{min-width:0}.ticker{font-size:40.5px;line-height:1}.name{font-size:24px;color:#a4a4a4;margin-top:8px}.type{font-size:19.5px;margin-left:5px;padding:3px 7px;border-radius:7px;background:#31123b;color:#d958ff;vertical-align:5px}.type.crypto{background:#392300;color:#ff9e19}
    .tabs{height:56px;margin:2px 10px 0;display:flex;align-items:center;justify-content:space-between;color:#a9a9a9;font-size:24px}.tab{padding:8px 3px;border-radius:10px}.tab.active{background:#282828;color:#fff}
    .quote{height:104px;padding:10px 20px 0;display:flex;align-items:flex-start;position:relative}.quote strong{font-size:64.5px;letter-spacing:-2.5px}.change{margin-left:auto;padding-top:11px;font-size:25.5px;color:#06bf77;text-align:right;line-height:1.05}.past{display:block;color:#aaa;margin:5px 0 0;font-size:18px}
    .ranges{height:58px;padding:2px 14px;display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.range{height:42px;border-radius:21px;background:#242424;color:#aaa;display:grid;place-items:center;font-size:22.5px}.range.active{background:#f0f0f0;color:#111;font-weight:600}
    .chart{height:310px;position:relative;margin-top:2px}.chart svg{width:100%;height:100%;display:block}.chart-glow{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,190,118,.04));pointer-events:none}
    .metrics{height:112px;border-top:1px solid #202020;border-bottom:1px solid #202020;display:grid;grid-template-columns:repeat(4,1fr);padding:14px 18px 10px;gap:8px}.metric label{display:block;color:#999;font-size:19.5px;line-height:1.05}.metric b{display:block;font-size:25.5px;font-weight:400;margin-top:8px;white-space:nowrap}
    .about{height:82px;padding:17px 20px 0}.about-title{font-size:30px;font-weight:600}.about-copy{font-size:18px;color:#7f7f7f;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .actions{height:88px;padding:8px 18px 13px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{border:0;border-radius:14px;color:#fff;font:600 30px Geist;background:#242424}.action.long{background:#09bd77}.action.short{background:#fb5b60}
    .phone.crypto-screen .tabs{visibility:hidden;height:15px}.phone.crypto-screen .chart{height:342px}.phone.crypto-screen .actions{grid-template-columns:repeat(2,1fr)}.phone.crypto-screen .spot{display:none}
  </style>
</head>
<body>
  <div id="viewport" data-composition-id="minara-shot-07" data-width="1920" data-height="1080" data-start="0" data-duration="4" data-fps="60">
    <main id="shot"><div class="floor"></div></main>
  </div>
  <script src="./assets/vendor/gsap.min.js"></script>
  <script>
    const shot=document.querySelector('#shot');const fit=()=>{const v=document.querySelector('#viewport');shot.style.transform=`scale(${v.clientWidth/1920})`};addEventListener('resize',fit);fit();
    const stocks=[
      {ticker:'$SNDK',name:'Sandisk',type:'Stock',logo:'./assets/logos/sndk.png',price:'$1.58K',change:'$362.67 (29.7%)',cap:'$223.1B',pe:'18.22',fwd:'5.79',vol:'21.64M',seed:19,mode:'climb'},
      {ticker:'$CBRS',name:'Cerebras Systems',type:'Stock',logo:'./assets/logos/cerebras.png',price:'$229.21',change:'$1.71 (0.7516%)',cap:'$54.87B',pe:'592.33',fwd:'178.1',vol:'16.46M',seed:43,mode:'spike'},
      {ticker:'$HYPE',name:'HYPE',type:'Crypto',logo:'./assets/logos/hype.png',price:'$56.66',change:'$1.68 (3.05%)',cap:'$56.68',pe:'$23.15M',fwd:'$36.81M',vol:'0.0000%',seed:79,mode:'wave'}
    ];
    const phoneMarkup=(d,i)=>`<article class="phone ${d.type==='Crypto'?'crypto-screen':''}" data-index="${i}"><div class="status" data-grow><span>17:08 ◐</span><span class="signal">▮▮▮ ◇</span><span class="battery">${61+i}</span></div><div class="asset-head" data-grow><span class="back">‹</span><span class="logo"><img src="${d.logo}" alt="${d.name} logo"></span><div class="asset-copy"><div class="ticker">${d.ticker}<span class="type ${d.type==='Crypto'?'crypto':''}">${d.type}</span></div><div class="name">${d.name}</div></div></div><nav class="tabs" data-grow><span class="tab active">Overview</span><span class="tab">Stats</span><span class="tab">Earnings</span><span class="tab">Analyst</span><span class="tab">News</span></nav><div class="quote" data-grow><strong>${d.price}</strong><span class="change">${d.change}<span class="past">Past 1 day</span></span></div><div class="ranges" data-grow><span class="range">1H</span><span class="range">4H</span><span class="range active">1D</span><span class="range">1W</span><span class="range">1M</span><span class="range">All</span></div><div class="chart"><svg viewBox="0 0 480 428" preserveAspectRatio="none"><path class="area-path" fill="rgba(0,190,118,.08)"/><path class="line-path" fill="none" stroke="#08be77" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="chart-glow"></div></div><div class="metrics" data-grow><div class="metric"><label>${d.type==='Crypto'?'Mark':'Market Cap'}</label><b>${d.cap}</b></div><div class="metric"><label>${d.type==='Crypto'?'24h Vol':'P/E (TTM)'}</label><b>${d.pe}</b></div><div class="metric"><label>${d.type==='Crypto'?'Open Interest':'P/E (Fwd)'}</label><b>${d.fwd}</b></div><div class="metric"><label>${d.type==='Crypto'?'Funding':'Vol'}</label><b>${d.vol}</b></div></div><div class="about" data-grow><div class="about-title">About ${d.ticker.slice(1)}</div><div class="about-copy">Live market intelligence, company fundamentals and real-time analysis.</div></div><div class="actions" data-grow><button class="action long">Long</button><button class="action short">Short</button><button class="action spot">Spot</button></div></article>`;
    stocks.forEach((d,i)=>shot.insertAdjacentHTML('beforeend',phoneMarkup(d,i)));
    const phones=[...shot.querySelectorAll('.phone')];
    const paths=[];
    phones.forEach((phone,i)=>{const d=stocks[i],line=phone.querySelector('.line-path'),area=phone.querySelector('.area-path');let seed=d.seed,y=.68,pts=[];const rand=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);for(let x=0;x<=480;x+=4){let drift=(rand()-.5)*.08;if(d.mode==='climb')drift+=(x>115?.006:.001)+(x>405?.12:0);if(d.mode==='spike')drift+=(x>285&&x<335?.06:0)+(x===340?-.86:0);if(d.mode==='wave')drift+=(x>250?.01:-.0015)+Math.sin(x/27)*.005;y=Math.max(.06,Math.min(.94,y+drift));pts.push([x,428*y])}const lineD='M'+pts.map(p=>p.join(',')).join(' L');line.setAttribute('d',lineD);area.setAttribute('d',`${lineD} L480,428 L0,428 Z`);const len=line.getTotalLength();gsap.set(line,{strokeDasharray:len,strokeDashoffset:len});gsap.set(area,{opacity:0});paths.push({line,area})});
    gsap.set(phones,{y:1080});phones.forEach(phone=>gsap.set(phone.querySelectorAll('[data-grow]'),{opacity:0,y:18,scale:.97}));
    const tl=gsap.timeline({paused:true});
    phones.forEach((phone,i)=>{const start=i*.28;tl.to(phone,{y:0,duration:1.12,ease:'power3.out'},start).to(phone.querySelectorAll('[data-grow]'),{opacity:1,y:0,scale:1,duration:.42,stagger:.055,ease:'power2.out'},start+.001).to(paths[i].line,{strokeDashoffset:0,duration:2.15,ease:'power2.inOut'},start+.001).to(paths[i].area,{opacity:1,duration:.9,ease:'power1.out'},start+.72)});tl.duration(4);window.__timelines=window.__timelines||{};window.__timelines['minara-shot-07']=tl;
  </script>
</body>
</html>
