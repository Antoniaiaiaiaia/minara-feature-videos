  <script>
    (function(){
      var orbitState={progress:0,visibility:0};
      var orbitItems=[
        ['.a1',Math.PI,760,275],['.a2',0,760,275],['.a3',-Math.PI/2,760,275],['.a4',Math.PI/2,760,275],

      function updateOrbit(){
        orbitItems.forEach(function(item,index){
          var angle=item[1]-orbitState.progress*Math.PI*1.25;
          var depth=(Math.sin(angle)+1)/2;
          var el=document.querySelector(item[0]);
          gsap.set(el,{x:Math.cos(angle)*item[2],y:Math.sin(angle)*item[3],scale:.68+depth*.48,rotation:(depth-.5)*8,opacity:(.5+depth*.5)*orbitState.visibility,filter:'blur('+((1-depth)*1.4)+'px)'});

        });
      }
      updateOrbit();
      var tl=gsap.timeline({paused:true});
      tl.fromTo('#phone',{y:90,scale:.9,opacity:0,filter:'blur(10px)'},{y:0,scale:1,opacity:1,filter:'blur(0px)',duration:.48,ease:'power3.out'},0)
