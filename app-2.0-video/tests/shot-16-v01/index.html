    .footer{height:58px;display:grid;grid-template-columns:58px 1fr;gap:13px}.star{display:grid;place-items:center;border-radius:15px;background:#f7f7f8;color:#f39a00;font-size:31px}.run{display:grid;place-items:center;border-radius:15px;background:#08bd78;color:#fff;font-size:23px;font-weight:600}.card:nth-child(4n+2) .run{background:#111}.card:nth-child(4n+3) .return,.card:nth-child(4n+3) .window b{color:#15a97b}.card:nth-child(5n) {background:#f9f9fa}
