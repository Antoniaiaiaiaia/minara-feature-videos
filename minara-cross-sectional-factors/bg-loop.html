<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#F9F9F9;}
  #root,[data-composition-id="root"]{background:#F9F9F9;}
  canvas{display:block;}
</style>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="2560" data-height="1440" data-start="0" data-duration="8">
    <canvas id="c" width="2560" height="1440"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

      const W=2560,H=1440;
      const BG='#F9F9F9', DARK10='#E0E0E0';
      const ctx=document.getElementById('c').getContext('2d');

      const left=80,right=2480, n=72;
      const slot=(right-left)/n, bw=slot*0.5;
      const chartTop=200, chartBottom=1280;

      // ---- Continuous OHLC walk (generated once; final OHLC stays fixed) ----
      const rnd=mulberry32(20260626);
      let candles=[], close=0.45;
      for(let i=0;i<n;i++){
        const t=i/n;
        let drift,vol;
        if(t<0.30){drift=0.004;vol=0.045;}
        else if(t<0.46){drift=-0.007;vol=0.05;}
        else if(t<0.53){drift=0.052;vol=0.055;}
        else{drift=0.017;vol=0.05;}
        const o=close;
        close=o+drift+(rnd()-0.5)*vol*2;
        const up=close>=o, body=Math.abs(close-o), base=Math.max(body,vol*0.35);
        const upW=(rnd()*0.55+(rnd()>0.88?1.1:0))*base;
        const dnW=(rnd()*0.55+(rnd()>0.88?1.1:0))*base;
        // Wiggle seed per candle (small deterministic movement as it forms)
        candles.push({o,c:close,hi:Math.max(o,close)+upW,lo:Math.min(o,close)-dnW,up,wig:rnd()});
      }
      // Fixed Y axis (global min/max keeps coordinates stable while candles grow)
      let min=1e9,max=-1e9;
      candles.forEach(k=>{min=Math.min(min,k.lo);max=Math.max(max,k.hi);});
      const pad=(max-min)*0.06; min-=pad; max+=pad;
      const Y=v=>chartBottom-((v-min)/(max-min))*(chartBottom-chartTop);

      function drawCandle(i,cx,o,c,hi,lo){
        const yH=Y(hi),yL=Y(lo),bt=Math.min(Y(o),Y(c)),bh=Math.max(3,Math.abs(Y(c)-Y(o)));
        ctx.strokeStyle=DARK10;ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx,yH);ctx.lineTo(cx,yL);ctx.stroke();
        ctx.fillStyle=DARK10;ctx.fillRect(cx-bw/2,bt,bw,bh);
      }
      const easeOut=x=>1-(1-x)*(1-x);

      function render(p){
        ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
        // Grid stays full and does not participate in fades
        ctx.strokeStyle=DARK10;ctx.lineWidth=1;
        ctx.beginPath();
        for(let x=0;x<=W;x+=160){ctx.moveTo(x+0.5,0);ctx.lineTo(x+0.5,H);}
        for(let y=0;y<=H;y+=120){ctx.moveTo(0,y+0.5);ctx.lineTo(W,y+0.5);}
        ctx.stroke();

        // Phases: grow [0,0.85] → hold [0.85,0.925] → fade out [0.925,1]
        const buildEnd=0.85, fadeStart=0.925;
        let alpha=1;
        if(p>=fadeStart) alpha=Math.max(0,1-(p-fadeStart)/(1-fadeStart));
        const bp=Math.min(p/buildEnd,1);
        const exact=bp*n;
        const k=Math.floor(exact);
        const frac=exact-k;

        ctx.globalAlpha=alpha;
        let lineClose=null;

        // Completed candles
        const done=Math.min(k,n);
        for(let i=0;i<done;i++){
          const cx=left+slot*i+slot/2, kk=candles[i];
          drawCandle(i,cx,kk.o,kk.c,kk.hi,kk.lo);
        }
        if(done>0) lineClose=candles[done-1].c;

        // Growing candle (open→close, extended wick, and slight ticking)
        if(k<n && frac>0){
          const kk=candles[k], cx=left+slot*k+slot/2;
          const e=easeOut(frac);
          const wig=(0.18)*Math.sin(frac*Math.PI*3 + kk.wig*6.28)*(1-frac);
          const closeNow=kk.o+(kk.c-kk.o)*e + (kk.c-kk.o)*wig;
          const hiNow=Math.max(kk.o,closeNow)+(kk.hi-Math.max(kk.o,kk.c))*e;
          const loNow=Math.min(kk.o,closeNow)-(Math.min(kk.o,kk.c)-kk.lo)*e;
          drawCandle(k,cx,kk.o,closeNow,hiNow,loNow);
          lineClose=closeNow;
        }

        // Dashed price line follows the latest close
        if(lineClose!==null){
          const ly=Y(lineClose);
          ctx.strokeStyle=DARK10;ctx.lineWidth=1.5;ctx.setLineDash([3,6]);
          ctx.beginPath();ctx.moveTo(0,ly+0.5);ctx.lineTo(W,ly+0.5);ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.globalAlpha=1;
      }

      window.__render=render;
      window.__timelines=window.__timelines||{};
      const tl=gsap.timeline({paused:true});
      const st={p:0};
      tl.to(st,{p:1,duration:8,ease:'none',onUpdate:()=>render(st.p)});
      window.__timelines["root"]=tl;
      render(0);
      window.__loopReady=true;
    })();
    </script>
  </div>
</body>
</html>
