<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap');
html,body{margin:0;padding:0;background:#F9F9F9;}
#root,[data-composition-id="root"]{
  font-family:'Geist',system-ui,-apple-system,sans-serif;
  background:#F9F9F9; position:relative; overflow:hidden; width:1920px; height:1080px;
}
.camera{position:absolute;inset:0;transform-origin:0 0;will-change:transform;}
.wall{position:absolute;left:60px;top:101px;
  display:grid;grid-template-columns:repeat(6,480px);column-gap:36px;row-gap:32px;}
.pill{width:480px;height:150px;background:#FFFFFF;border:1px solid #ECECEC;border-radius:18px;
  display:flex;align-items:center;gap:24px;padding:0 38px;box-sizing:border-box;
  box-shadow:0 4px 18px rgba(20,20,22,0.04);}
.mono{width:68px;height:68px;border-radius:50%;background:#F0F0F0;color:#141416;
  font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
/* Make every logo circular and enlarge by 10% (62→68px) */
.logo{width:68px;height:68px;border-radius:50%;object-fit:cover;background:#FFFFFF;
  border:1px solid #EEEEEE;flex:0 0 auto;}
.tk{font-size:42px;font-weight:700;color:#141416;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="5">
    <div class="camera"><div class="wall" id="wall"></div></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const TICK=["NVDA","MU","MRVL","MSFT","SK Hynix","ORCL","GOOGL","SNDK","INTC","DRAM",
                  "CBRS","CRCL","META","TSLA","PLTR","AAPL","BB","AMD","CRWV","AMZN",
                  "TSM","LITE","HOOD","MSTR","Samsung","EWY","HIMS","BABA","RKLB","COIN"];
      // Tickers with real logos; the rest use a gray monogram
      const LOGO=new Set(["NVDA","MU","MSFT","ORCL","GOOGL","SNDK","INTC","CRCL","META",
                  "TSLA","PLTR","AAPL","AMD","CRWV","AMZN","TSM","LITE","HOOD","MSTR","EWY","BABA","COIN"]);
      const wall=document.getElementById('wall');
      TICK.forEach(t=>{
        const d=document.createElement('div');d.className='pill';
        const mark = LOGO.has(t)
          ? '<img class="logo" src="assets/logos/'+t+'.png" crossorigin="anonymous">'
          : '<span class="mono">'+t[0]+'</span>';
        d.innerHTML=mark+'<span class="tk">'+t+'</span>';
        wall.appendChild(d);
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true });
      tl.set('.camera', { transformOrigin:'0px 0px', x:0, y:0, scale:1 }, 0);
      // Pills pop in one by one
      tl.from('.pill', { opacity:0, y:24, scale:0.96, duration:0.5, ease:'power2.out', stagger:0.018 }, 0.1);
      // Camera pans slowly across
      tl.to('.camera', { x:-1200, duration:4.0, ease:'power1.inOut' }, 1.0);
      window.__timelines["root"] = tl;
    </script>
  </div>
</body>
</html>
