<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap');
html,body{margin:0;padding:0;background:#F9F9F9;}
#root,[data-composition-id="root"]{
  font-family:'Geist','PingFang SC','Hiragino Sans GB','Noto Sans SC',system-ui,-apple-system,sans-serif;
  background:#F9F9F9; position:relative; overflow:hidden; width:1920px; height:1080px;
}
.bg-video{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}
.txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;}
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.title-line{font-size:212px;font-weight:700;color:#141416;letter-spacing:0.04em;line-height:1.12;white-space:nowrap;}
</style>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="1.967">
    <video class="bg-video" src="assets/title-bg.mp4" muted playsinline crossorigin="anonymous"
           data-start="0" data-duration="1.967" data-media-start="6.5" data-track-index="0"></video>
    <div class="txt clip" data-start="0" data-duration="1.967" data-track-index="1">
      <div class="title-wrap">
        <div class="title-line l1">几秒充值</div>
        <div class="title-line l2">几秒交易</div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true });
      tl.from('.l1', { opacity:0, y:46, scale:0.96, duration:0.6, ease:'power3.out' }, 0.1);
      tl.from('.l2', { opacity:0, y:40, scale:0.96, duration:0.6, ease:'power3.out' }, 0.24);
      window.__timelines["root"] = tl;
    </script>
  </div>
</body>
</html>
