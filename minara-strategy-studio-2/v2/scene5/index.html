<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F9F9F9}
#root,[data-composition-id="root"]{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:#F9F9F9;font-family:'Geist',system-ui,-apple-system,sans-serif;color:#141416}
.badge{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;box-shadow:0 14px 30px -12px rgba(0,0,0,.28)}
.deploy{position:absolute;left:960px;top:540px;width:640px;height:230px;border-radius:115px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(120deg,#EB53FF,#FF538E 48%,#FF9A32);
  box-shadow:0 34px 70px -20px rgba(255,83,142,.55);
  color:#fff;font-size:96px;font-weight:800;letter-spacing:-.01em;z-index:5}
.divider{position:absolute;left:960px;top:210px;width:2px;height:660px;background:#ECECEC;
  transform-origin:top center;opacity:0}
.vs{position:absolute;left:960px;top:540px;width:96px;height:96px;border-radius:50%;
  transform:translate(-50%,-50%);opacity:0;background:#141416;color:#fff;font-weight:800;font-size:32px;
  display:flex;align-items:center;justify-content:center;letter-spacing:.02em;box-shadow:0 20px 40px -14px rgba(0,0,0,.35)}
.panel{position:absolute;top:210px;width:760px;height:660px;opacity:0}
#leftPanel{left:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#rightPanel{left:1010px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent)}
#rightScroller{display:flex;flex-direction:column;gap:30px}
.lbl{font-size:30px;font-weight:700;color:#8a8a8a;letter-spacing:.04em;text-transform:uppercase}
.feeBig{font-variant-numeric:tabular-nums;font-size:168px;font-weight:800;color:#07B56A;
  line-height:1;margin:22px 0;opacity:0}
.subLbl{font-size:32px;font-weight:600;color:#8a8a8a}
.row{height:148px;background:#fff;border:1px solid #ECECEC;border-radius:24px;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.18);padding:0 40px;
  display:flex;align-items:center;justify-content:space-between;opacity:0}
.rowLeft{display:flex;align-items:center;gap:26px}
.logoCircle{width:72px;height:72px;border-radius:50%;background:#fff;border:1px solid #ECECEC;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.logoCircle img{width:42px;height:42px;object-fit:contain}
.rowName{font-size:36px;font-weight:700;color:#141416}
.rowWord{font-size:38px;font-weight:700;letter-spacing:-.01em}
.rowFee{font-variant-numeric:tabular-nums;font-size:48px;font-weight:800;color:#F75D5F}
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="6">
  <!-- converging token badges (JS-generated rings) -->
  <div class="deploy" id="deploy">Deploy</div>
  <div class="divider" id="divider"></div>
  <div class="vs" id="vs">VS</div>
  <div class="panel" id="leftPanel">
    <div class="lbl">Minara</div>
    <div class="feeBig" id="feeBig">0.10%</div>
    <div class="subLbl">Fees</div>
  </div>
  <div class="panel" id="rightPanel">
    <div id="rightScroller"></div>
  </div>
</div>
<script src="lib/gsap.min.js"></script><script src="lib/CustomEase.min.js"></script>
<script>
gsap.registerPlugin(CustomEase);
const SNAP=CustomEase.create("snap","M0,0 C0.95,0.03 0,0.98 1,1");

// 5.0 build the converging ring of token badges left over from scene 4
const TOKENS=[
 ['₿','#F7931A','#fff'],['Ξ','#627EEA','#fff'],['◎','#14F195','#000'],
 ['N','#76B900','#fff'],['A','#111','#fff'],['Au','#E8B10A','#fff'],
 ['S','#2f7ff0','#fff'],['N','#5b63e6','#fff'],['$','#2775CA','#fff']
];
const root=document.getElementById('root');
const cx=960,cy=540;
const rings=[{r:330,n:10,size:74},{r:460,n:12,size:62}];
const badgeEls=[];let idx=0;
rings.forEach(ring=>{
  for(let i=0;i<ring.n;i++){
    const a=(-90+(i+.5)*(360/ring.n))*Math.PI/180;
    const x=cx+Math.cos(a)*ring.r, y=cy+Math.sin(a)*ring.r;
    const tk=TOKENS[idx%TOKENS.length];idx++;
    const d=document.createElement('div');
    d.className='badge';
    d.style.left=(x-ring.size/2)+'px';d.style.top=(y-ring.size/2)+'px';
    d.style.width=ring.size+'px';d.style.height=ring.size+'px';
    d.style.background=tk[1];d.style.color=tk[2];
    d.style.fontSize=(ring.size*.42)+'px';
    d.textContent=tk[0];
    root.insertBefore(d,document.getElementById('deploy'));
    badgeEls.push(d);
  }
});

// 5.0b build the long right-hand fee list (real brokerages, real logos where available)
const ROWS=[
 {name:'Binance',fee:'0.100%',logo:'binance.svg'},
 {name:'OKX',fee:'0.080%',logo:'okx.svg'},
 {name:'Coinbase',fee:'0.600%',logo:'coinbase.svg'},
 {name:'Kraken',fee:'0.250%',word:'#5741D9'},
 {name:'Robinhood',fee:'0.150%',logo:'robinhood.svg'},
 {name:'Charles Schwab',fee:'0.250%',word:'#0072CE'},
 {name:'Fidelity',fee:'0.350%',word:'#4C9A2A'},
 {name:'Interactive Brokers',fee:'0.200%',word:'#DA1710'},
 {name:'E*TRADE',fee:'0.300%',word:'#6600CC'}
];
const scroller=document.getElementById('rightScroller');
const rowEls=[];
ROWS.forEach(r=>{
  const row=document.createElement('div');row.className='row';
  const left=document.createElement('div');left.className='rowLeft';
  if(r.logo){
    const circ=document.createElement('div');circ.className='logoCircle';
    const img=document.createElement('img');img.src='assets/logos/'+r.logo;img.alt=r.name;
    circ.appendChild(img);left.appendChild(circ);
    const nm=document.createElement('span');nm.className='rowName';nm.textContent=r.name;
    left.appendChild(nm);
  }else{
    const wm=document.createElement('span');wm.className='rowWord';wm.style.color=r.word;wm.textContent=r.name;
    left.appendChild(wm);
  }
  const fee=document.createElement('span');fee.className='rowFee';fee.textContent=r.fee;
  row.appendChild(left);row.appendChild(fee);
  scroller.appendChild(row);
  rowEls.push(row);
});
// exact scroll distance: content height minus viewport height (both deterministic from fixed CSS sizes)
const ROW_H=148,ROW_GAP=30,VIEWPORT_H=660;
const scrollDist=(ROWS.length*ROW_H+(ROWS.length-1)*ROW_GAP)-VIEWPORT_H;

gsap.set('#deploy',{xPercent:-50,yPercent:-50,scale:0,opacity:0});
gsap.set(rowEls,{opacity:0,y:24,scale:.92});

const tl=gsap.timeline({paused:true});

// 5.1 circles converge toward center (0 - ~1.08)
tl.to(badgeEls,{left:960,top:540,xPercent:-50,yPercent:-50,scale:.22,opacity:0,duration:.55,ease:SNAP,stagger:.025},0);
// 5.2 Deploy pops in AMONG the still-converging circles (overlap, not after) — they fade behind it
tl.to('#deploy',{scale:1,opacity:1,duration:.5,ease:'back.out(1.6)'},.4);
// 5.3 hold, then button clears out to make room for the comparison
tl.to('#deploy',{scale:.72,opacity:0,y:-40,duration:.5,ease:'power2.in'},1.75);

// 5.4 fee comparison: Minara fixed + dominant on the left, long scrolling broker list on the right
tl.fromTo('#leftPanel',{opacity:0,x:-90},{opacity:1,x:0,duration:.6,ease:SNAP},2.15);
tl.fromTo('#rightPanel',{opacity:0,x:90},{opacity:1,x:0,duration:.6,ease:SNAP},2.15);
tl.fromTo('#divider',{opacity:0,scaleY:0},{opacity:1,scaleY:1,duration:.5,ease:SNAP},2.2);
tl.fromTo('#vs',{opacity:0,scale:0},{opacity:1,scale:1,duration:.45,ease:'back.out(1.7)'},2.8);

// 5.5 Minara fee counts DOWN 0.10% -> 0.02% via a numeric proxy (never tween DOM textContent directly)
const feeEl=document.getElementById('feeBig');
const feeProxy={v:0.10};
feeEl.textContent=feeProxy.v.toFixed(2)+'%';
tl.fromTo('#feeBig',{opacity:0,scale:.6,y:20},{opacity:1,scale:1,y:0,duration:.45,ease:'back.out(1.6)'},2.55);
tl.to(feeProxy,{v:0.02,duration:1.2,ease:'power2.out',onUpdate:()=>{feeEl.textContent=feeProxy.v.toFixed(2)+'%';}},3.0);

// 5.6 broker rows pop in, then the whole column scrolls up to reveal the rest (finite, deterministic)
tl.fromTo(rowEls,{opacity:0,y:24,scale:.92},{opacity:1,y:0,scale:1,duration:.45,ease:'back.out(1.6)',stagger:.09},2.75);
tl.to('#rightScroller',{y:-scrollDist,duration:1.6,ease:SNAP},4.15);

window.__timelines=window.__timelines||{};window.__timelines["root"]=tl;
</script></body></html>
