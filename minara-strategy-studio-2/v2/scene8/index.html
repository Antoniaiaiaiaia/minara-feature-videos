<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#F9F9F9}
  #root,[data-composition-id="root"]{position:relative;width:1920px;height:1080px;overflow:hidden;
    background:#F9F9F9;font-family:'Geist',system-ui,-apple-system,sans-serif;color:#141416}
  #boxLayer{position:absolute;top:0;left:0;width:1920px;height:1080px}
  #boxLayer canvas{display:block}
</style>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="2.5">
    <div id="boxLayer"></div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="lib/gsap.min.js"></script>
  <script src="lib/CustomEase.min.js"></script>
  <script>
  gsap.registerPlugin(CustomEase);
  const SNAP=CustomEase.create("snap","M0,0 C0.95,0.03 0,0.98 1,1");
  const DUR=2;

  // deterministic RNG (mulberry32, fixed seed) — no Math.random
  function mk(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
  const rnd=mk(11);

  // ---------- three.js black boxes ----------
  const layer=document.getElementById('boxLayer'), W=1920,H=1080;
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(W,H);renderer.setPixelRatio(2);layer.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(38,W/H,0.1,100);cam.position.set(0,0,11);
  function gradTex(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,220,256);g.addColorStop(0,'#050505');g.addColorStop(1,'#565656');
    x.fillStyle=g;x.fillRect(0,0,256,256);x.strokeStyle='rgba(120,120,120,.25)';x.lineWidth=6;
    x.strokeRect(3,3,250,250);return new THREE.CanvasTexture(c);}
  const boxTex=gradTex();
  scene.add(new THREE.AmbientLight(0xffffff,.55));
  const d1=new THREE.DirectionalLight(0xffffff,.9);d1.position.set(3,5,4);scene.add(d1);
  const d2=new THREE.DirectionalLight(0xffffff,.35);d2.position.set(-4,-2,2);scene.add(d2);
  function render3(){renderer.render(scene,cam);}

  // ---------- build N boxes at deterministic varying size/position/depth ----------
  const N=13;
  const boxes=[];
  for(let i=0;i<N;i++){
    const size=0.55+rnd()*1.35;               // varying sizes 0.55–1.9
    const mat=new THREE.MeshStandardMaterial({map:boxTex,roughness:.55,metalness:.15});
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(size,size,size),mat);
    const x=(rnd()-0.5)*9.6, y=(rnd()-0.5)*5.4, z=(rnd()-0.5)*4.0;
    const rx=rnd()*Math.PI*2, ry=rnd()*Math.PI*2, rz=rnd()*Math.PI*2;
    mesh.position.set(x,y,z);
    mesh.rotation.set(rx,ry,rz);
    mesh.scale.setScalar(0.0001);
    scene.add(mesh);
    // fragment cluster (2x2x2 = 8 small cubes) built now, hidden, placed at same spot
    const frag=new THREE.Group();
    frag.position.set(x,y,z);
    const fs=size/2;
    const fragCubes=[];
    for(let fx=-1;fx<=1;fx+=2)for(let fy=-1;fy<=1;fy+=2)for(let fz=-1;fz<=1;fz+=2){
      const fmesh=new THREE.Mesh(new THREE.BoxGeometry(fs*0.94,fs*0.94,fs*0.94),mat);
      fmesh.position.set(fx*fs*0.5,fy*fs*0.5,fz*fs*0.5);
      frag.add(fmesh);
      fragCubes.push({mesh:fmesh,dir:new THREE.Vector3(fx,fy,fz).normalize()});
    }
    frag.visible=false;
    scene.add(frag);
    boxes.push({mesh,frag,fragCubes,size,x,y,z,rx,ry,rz});
  }

  // ---------- master timeline (paused, seek-safe) ----------
  const tl=gsap.timeline({paused:true, onUpdate:render3});

  // Phase 1 (0 – 1.0s): boxes spin + pop in, staggered
  const POP_START=0.0, POP_SPAN=0.85, POP_DUR=0.5;
  for(let i=0;i<N;i++){
    const b=boxes[i];
    const at=POP_START+(i/(N-1))*(POP_SPAN-POP_DUR);
    tl.to(b.mesh.scale,{x:1,y:1,z:1,duration:POP_DUR,ease:'back.out(1.8)'},at);
    const spin=Math.PI*(1.4+rnd()*1.2);
    tl.to(b.mesh.rotation,{y:b.ry+spin,x:b.rx+spin*0.4,duration:POP_DUR+0.15,ease:SNAP},at);
  }

  // Phase 2 (1.0 – 2.0s): shatter — swap each box for its fragment cluster and fling outward
  const SHATTER_AT=1.0, SHATTER_DUR=0.85;
  for(let i=0;i<N;i++){
    const b=boxes[i];
    tl.set(b.mesh,{visible:false},SHATTER_AT);
    tl.set(b.frag,{visible:true},SHATTER_AT);
    const dist=2.2+rnd()*2.6;
    b.fragCubes.forEach((fc,j)=>{
      const jitter=0.7+rnd()*0.6;
      tl.to(fc.mesh.position,{
        x:fc.dir.x*dist*jitter,
        y:fc.dir.y*dist*jitter,
        z:fc.dir.z*dist*jitter,
        duration:SHATTER_DUR,ease:'power2.in'
      },SHATTER_AT);
      const spinX=(rnd()-0.5)*Math.PI*4, spinY=(rnd()-0.5)*Math.PI*4;
      tl.to(fc.mesh.rotation,{x:spinX,y:spinY,duration:SHATTER_DUR,ease:SNAP},SHATTER_AT);
      tl.to(fc.mesh.scale,{x:0.05,y:0.05,z:0.05,duration:SHATTER_DUR,ease:'power2.in'},SHATTER_AT);
      tl.to(fc.mesh.material,{opacity:0,duration:SHATTER_DUR,ease:'power2.in'},SHATTER_AT+0.15);
      fc.mesh.material.transparent=true;
    });
  }

  window.__timelines=window.__timelines||{};
  /* fit to reference-narration timeline (subtitle video) */var __T=2.5;if(tl.duration()>__T+0.01){tl.duration(__T);}else if(tl.duration()<__T-0.01){tl.to({_p:0},{_p:1,duration:__T-tl.duration()});}
  window.__timelines["root"]=tl;
  render3(); // initial frame
  </script>
</body>
</html>
